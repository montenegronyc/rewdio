[project]
name = "rewdio-mcp"
version = "0.1.0"
description = "MCP server that lets Claude drive REW and a miniDSP to calibrate subs and mains autonomously"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
rewdio-mcp = "rewdio.server:main"
rewdio-dashboard = "rewdio.dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rewdio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
